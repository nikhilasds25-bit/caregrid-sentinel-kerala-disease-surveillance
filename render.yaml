services:
  - type: web
    name: caregrid-sentinel-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/prepare_analytical_data.py
    startCommand: uvicorn caregrid.api:app --app-dir src --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.11
